name: Community Cakes Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

env:
  GITHUB_ACTION_RUN_ID: ${{ github.run_id }}
  GITHUB_ACTION_RUN_NUMBER: ${{ github.run_number }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  collect-data:
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: linux-x64
            runner: ubuntu-latest
            mode: docker
          - id: macos-arm64
            runner: macos-latest
            mode: host
          - id: windows-x64
            runner: windows-latest
            mode: host
    runs-on: ${{ matrix.os.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        if: ${{ matrix.os.mode == 'host' }}
        with:
          deno-version: v2.x

      - name: Install MoonBit nightly on macOS
        if: ${{ matrix.os.mode == 'host' && runner.os != 'Windows' }}
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          "$HOME/.moon/bin/moon" version --all
          "$HOME/.moon/bin/moon" update

      - name: Install MoonBit nightly on Windows
        if: ${{ matrix.os.mode == 'host' && runner.os == 'Windows' }}
        shell: powershell
        env:
          MOONBIT_INSTALL_VERSION: nightly
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.moon\bin\moon.exe" version --all
          & "$env:USERPROFILE\.moon\bin\moon.exe" update

      - name: Collect on host runner
        if: ${{ matrix.os.mode == 'host' }}
        shell: bash
        run: |
          deno run -A main.ts stat \
            --config resources/repos.yaml \
            --os ${{ matrix.os.id }} \
            --out-dir data/community/${{ matrix.os.id }} \
            --max-concurrent-repos 2

      - name: Build linux-x64 image
        if: ${{ matrix.os.mode == 'docker' }}
        run: docker build -f Dockerfile.linux-x64 -t community-cakes-linux-x64 .

      - name: Install MoonBit nightly and collect in linux-x64 image
        if: ${{ matrix.os.mode == 'docker' }}
        run: |
          docker run --rm \
            -e GITHUB_ACTION_RUN_ID \
            -e GITHUB_ACTION_RUN_NUMBER \
            -v "$PWD:/workspace" \
            -w /workspace \
            community-cakes-linux-x64 \
            bash -euo pipefail -c '
              curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
              export PATH="$HOME/.moon/bin:$PATH"
              moon version --all
              moon update
              deno run -A main.ts stat \
                --config resources/repos.yaml \
                --os linux-x64 \
                --out-dir data/community/linux-x64 \
                --max-concurrent-repos 2
            '

      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: community-${{ matrix.os.id }}
          path: data/community/${{ matrix.os.id }}/
          if-no-files-found: error
          retention-days: 1

  publish-site:
    needs: collect-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize data
        run: |
          mkdir -p data/community/linux-x64 data/community/macos-arm64 data/community/windows-x64
          cp -r artifacts/community-linux-x64/* data/community/linux-x64/
          cp -r artifacts/community-macos-arm64/* data/community/macos-arm64/
          cp -r artifacts/community-windows-x64/* data/community/windows-x64/

      - name: Bundle web
        run: deno task bundle

      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp index.html publish/
          cp web.js publish/
          cp -r data publish/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish
          retention-days: 90

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
