      test:
        skip: true
        reason: 'temporarily disable'
  'https://github.com/moonbit-community/moonyacc-example-arithmetic':
    branch: main
  'https://github.com/moonbit-community/moon_cosmic':
    branch: master
  'https://github.com/moonbit-community/moon_cpal':
    branch: main
    resource_intensive: true
    matrix:
      backends:
        - native
    modules:
      - path: '.'
        commands:
          check:
            shell: 'moon build --target {backend}'
            timeout_seconds: 1500
          test:
            shell: 'moon test --target {backend} && moon run --target {backend} cmd/enumerate -q'
            timeout_seconds: 1500
      - path: 'ci/downstream_smoke'
        commands:
          check:
            shell: 'moon check --target {backend} && moon build --target {backend}'
            timeout_seconds: 1500
          test:
            skip: true
            reason: 'this module only for downstream check/build'
