  'https://github.com/moonbit-community/tar':
    branch: main
  'https://github.com/moonbit-community/tch-mbt':
    branch: master
    resource_intensive: true
    matrix:
      os:
        - linux-x64
      backends:
        - native
    commands:
      check:
        shell: 'wget https://download.pytorch.org/libtorch/nightly/cpu/libtorch-shared-with-deps-latest.zip && unzip libtorch-shared-with-deps-latest.zip && moon check --target {backend}'
        timeout_seconds: 3600
      test:
        shell: 'CMAKE_PREFIX_PATH="$PWD/libtorch" bash build.sh'
        timeout_seconds: 3600
  'https://github.com/moonbit-community/tonyfettes-dl':
    branch: main
    matrix:
      exclude:
        - os: windows-x64
        - backend: wasm
        - backend: wasm-gc
        - backend: js
  'https://github.com/moonbit-community/tonyfettes-moon-clib':
    branch: main
  'https://github.com/moonbit-community/tonyfettes-small':
    branch: main
  'https://github.com/moonbit-community/unicode_data':
    branch: main
  'https://github.com/moonbit-community/uuidm':
    branch: main
  'https://github.com/moonbit-community/vscode.mbt':
    branch: master
    matrix:
      exclude:
        - backend: wasm
        - backend: wasm-gc
        - backend: native
  'https://github.com/moonbit-community/wasip2':
    branch: main
    matrix:
      exclude:
        - backend: native
        - backend: wasm-gc
        - backend: js
  'https://github.com/moonbit-community/which-mbt':
    branch: main
    overrides:
      - match:
          os:
            - linux-x64
            - macos-arm64
        commands:
          test:
            skip: true
            reason: 'Upstream CI only runs tests on Windows.'
      - match:
          backends:
            - wasm
            - wasm-gc
        commands:
          test:
            skip: true
            reason: 'Upstream CI only tests native and js targets.'
  'https://github.com/moonbit-community/xml-mbt':
    branch: main
  'https://github.com/moonbit-community/XMLParser':
    branch: main
    overrides:
      - match:
          os:
            - linux-x64
            - macos-arm64
        commands:
          test:
            shell: 'if [ ! -d resource ]; then sh scripts/init.sh; fi && moon test --target {backend} && moon test --release --target {backend}'
      - match:
          os:
            - windows-x64
        commands:
          test:
            shell: 'pwsh -NoProfile -ExecutionPolicy Bypass -Command "if (-not (Test-Path resource)) { ./scripts/init.ps1 }; moon test --target {backend}; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; moon test --release --target {backend}; exit $LASTEXITCODE"'
  'https://github.com/moonbit-community/yaml.mbt':
    branch: main
  'https://github.com/moonbit-community/zstd':
    branch: main
    overrides:
      # Known issue: zstd's JS backend test is temporarily disabled and will be fixed later.
      - match:
          backends:
            - js
        commands:
          test:
            skip: true
            reason: 'Known issue: zstd JS backend test is temporarily disabled; it will be fixed later.'
      - match:
          backends:
            - native
        commands:
          test:
            timeout_seconds: 2400
