  'https://github.com/moonbit-community/moon_elk':
    branch: main
    overrides:
      - match:
          os:
            - windows-x64
        commands:
          check:
            skip: true
            reason: 'moon_elk has a package with too many files, causing moon check command lines to exceed the Windows API length limit.'
