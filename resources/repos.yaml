# yaml-language-server: $schema=repos.schema.json
schema_version: 1

defaults:
  matrix:
    os:
      - windows-x64
      - macos-arm64
      - linux-x64
    backends:
      - wasm
      - wasm-gc
      - js
      - native

  commands:
    check:
      argv:
        - 'moon'
        - 'check'
        - '--target'
        - '{backend}'
      timeout_seconds: 600

    test:
      argv:
        - 'moon'
        - 'test'
        - '--target'
        - '{backend}'
      timeout_seconds: 1200
      run_after: check_passed

repos:
  'https://github.com/moonbitlang/parser':
    branch: master
    resource_intensive: true
    commands:
      test:
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
    matrix:
      exclude:
        - os: windows-x64
  'https://github.com/moonbitlang/x':
    branch: main
  'https://github.com/moonbit-community/adapton.mbt':
    branch: master
  'https://github.com/moonbit-community/Algorithms-Moonbit':
    branch: main
  'https://github.com/moonbit-community/ArgParser':
    branch: main
  'https://github.com/moonbit-community/bitset':
    branch: main
  'https://github.com/moonbit-community/color.mbt':
    branch: master
  'https://github.com/moonbit-community/dataview.mbt':
    branch: master
  'https://github.com/moonbit-community/diff':
    branch: main
  'https://github.com/moonbit-community/dot':
