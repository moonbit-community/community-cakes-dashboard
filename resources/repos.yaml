  'https://github.com/moonbit-community/sqlite3.mbt':
    branch: main
    matrix:
      exclude:
        - backend: wasm
        - backend: wasm-gc
        - backend: js
  'https://github.com/moonbit-community/starter':
    branch: main
  'https://github.com/moonbit-community/sw-http-server':
    branch: main
    matrix:
      exclude:
        - backend: wasm
        - backend: wasm-gc
        - backend: js
  'https://github.com/moonbit-community/sw-socket':
    branch: main
    matrix:
      os:
        - linux-x64
        - macos-arm64
      backends:
        - native
    commands:
      test:
        shell: 'moon test --target {backend} && moon test --target {backend} --release && moon test --doc'
  'https://github.com/moonbit-community/sw-terminfo':
